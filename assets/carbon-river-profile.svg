  <path fill="url(#carbon-grains)" d="M442 239Q548 228 656 247L811 246L831 281Q733 272 655 283T478 271Z"/>
  <path fill="none" stroke="#8a6c4a" stroke-width="2" opacity=".6" d="M493 253Q554 242 605 253T733 258Q778 251 817 266M534 272Q577 261 629 269T750 272Q790 266 830 279"/>

  <path fill="#92b9bd" d="M783 239H960V313Q883 297 849 273Q827 254 783 243Z"/>
  <path fill="none" stroke="#bed4d4" stroke-width="2" d="M848 250H882M909 250H952M871 270H904M928 270H960M919 290H955"/>
  <path fill="none" stroke="#879777" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M0 149L76 99L111 128L151 126L202 167L254 201L337 222"/>

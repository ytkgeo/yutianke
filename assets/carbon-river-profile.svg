      <text x="78" y="55">Source</text>
      <circle cx="363" cy="46" r="17" fill="#155762"/>
      <text x="363" y="54" text-anchor="middle" fill="#fff" font-size="22">2</text>
      <text x="390" y="55">Transformation</text>
      <circle cx="749" cy="46" r="17" fill="#994f36"/>
      <text x="749" y="54" text-anchor="middle" fill="#fff" font-size="22">3</text>
      <text x="776" y="55">Fate</text>
    </g>
    <g fill="#173e45">
      <text x="236" y="144">Thaw &amp; erosion</text>
      <text x="348" y="179">Mixing</text>
      <text x="495" y="119" text-anchor="middle">Dam construction</text>
      <text x="550" y="310" text-anchor="middle" fill="#493625">Reworking</text>
      <text x="677" y="310" text-anchor="middle" fill="#493625">Burial</text>
      <text x="890" y="209" text-anchor="middle">Export</text>
      <text x="630" y="157" text-anchor="middle" fill="#843e29">CO&#8322;</text>
    </g>
  </g>
</svg>

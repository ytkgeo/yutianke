  </g>
  <g fill="#b07345" stroke="#f7f6ef" stroke-width="1.5">
    <circle cx="214" cy="183" r="4.5"/>
    <circle cx="238" cy="201" r="4"/>
    <circle cx="309" cy="211" r="4.5"/>
    <circle cx="353" cy="214" r="3.5"/>
    <circle cx="388" cy="223" r="4.5"/>
    <circle cx="399" cy="225" r="4"/>
    <circle cx="580" cy="232" r="4.5"/>
    <circle cx="646" cy="239" r="4.5"/>
  </g>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 338" width="960" height="338">
  <title>Organic carbon from source to fate</title>
  <desc>A river long profile showing organic carbon released from uplands, mixed and transformed in the river, and degraded, buried, remobilized, or exported farther downstream. A dam impounds a reservoir with a sediment deposit. Arrows indicate pathways, not fluxes or distances.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#f7f7ef"/>
      <stop offset="1" stop-color="#e1ebe4"/>
    </linearGradient>
    <linearGradient id="sediment" x2="0" y2="1">
      <stop stop-color="#d0ba8d"/>
      <stop offset="1" stop-color="#b4976d"/>
    </linearGradient>
    <pattern id="carbon-grains" width="36" height="24" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2" fill="#765a40" opacity=".55"/>
      <circle cx="28" cy="19" r="1.5" fill="#765a40" opacity=".55"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#155762"/>
    </marker>
    <marker id="air-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#994f36"/>
    </marker>
    <path id="tree" d="M0 0L-9 18H-4L-12 29H-2V36H2V29H12L4 18H9Z"/>
  </defs>


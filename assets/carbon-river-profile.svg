    <path d="M183 123Q203 133 212 157"/>
    <path d="M344 186Q382 194 423 192"/>
    <path d="M554 280Q542 263 549 244"/>
    <path d="M673 249Q677 266 677 282"/>
    <path d="M812 229Q860 221 904 227"/>
  </g>

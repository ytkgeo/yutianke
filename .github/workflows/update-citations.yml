name: Update Google Scholar citations

# Google Scholar has no API and blocks cross-origin reads, so the number cannot
# be fetched in the browser on page load. This refreshes it server-side once a
# day and commits the result, which is the closest a static site can get to live.

on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC
  workflow_dispatch:        # allows a manual refresh from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read the Scholar profile and rewrite the count
        run: python scripts/update_scholar.py

      - name: Commit if the number moved
        run: |
          if [ -z "$(git status --porcelain index.html publications.html)" ]; then
            echo "Citation count unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html publications.html
          git commit -m "Update Google Scholar citation count"
          git push
